# One-off: the old versions' source is no longer published. Old tags and their releases are removed; the
# latest release (V92, which holds the Android apps people download) is moved onto this forwarding page.
name: Clear old source
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v84 v86; do gh release delete "$t" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || git push origin ":refs/tags/$t" || true; done
          git tag -f V92 HEAD && git push -f origin refs/tags/V92
          echo "::notice title=Tags now::$(git ls-remote --tags origin | awk '{print $2}' | tr '\n' ' ')"
